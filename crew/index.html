<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ส่งงาน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>/* iPhone: no manifest, so the home-screen icon keeps this exact link (with the personal code after #). Android: manifest for a proper app icon */if(!/iPhone|iPad|iPod/i.test(navigator.userAgent)){var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ส่งงาน">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>/* ไอคอนและชื่อที่อัปโหลดในระบบติดตามงานช่าง (ตั้งค่าระบบ → ไอคอนแอป) */var ICON_KEY='crew',ICONS_URL='https://script.google.com/macros/s/AKfycbx4K0FnllMcPspbu_8X2vFxzTm-pDmTtqtMa0qHkhBEKXenR5KjQ1jqwnoIRxuY10B-5A/exec?icons=1';function applyIcon(o){if(!o||!o.url)return;var a=document.querySelector('link[rel=apple-touch-icon]');if(a)a.href=o.url;var f=document.querySelector('link[rel=icon]');if(f)f.href=o.url;var im=document.querySelectorAll('img[data-icon]');for(var i=0;i<im.length;i++)im[i].src=o.url;if(o.name){var m=document.querySelector('meta[name=apple-mobile-web-app-title]');if(m)m.content=o.name;document.title=o.name;}}var ICON_NOW=null;try{ICON_NOW=JSON.parse(localStorage.getItem('spwIcon_'+ICON_KEY)||'null');}catch(e){}applyIcon(ICON_NOW);if(window.fetch)fetch(ICONS_URL).then(function(r){return r.json();}).then(function(j){var o=j&&j[ICON_KEY];if(o&&o.url){ICON_NOW=o;try{localStorage.setItem('spwIcon_'+ICON_KEY,JSON.stringify(o));}catch(e){}applyIcon(o);}}).catch(function(){});</script>
<meta name="theme-color" content="#3C3489">
<style>
:root{--p:#3C3489;--p2:#534AB7;--navy:#142b43}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:17px/1.6 -apple-system,system-ui,Tahoma,sans-serif;color:var(--navy);background:#EEF2F7}
header{background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 22px;display:flex;gap:14px;align-items:center}
header img{width:64px;height:64px;border-radius:15px;border:2px solid rgba(255,255,255,.35)}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;color:#CECBF6;font-size:14px}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border:1px solid #D3D1C7;border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}
ol{margin:0;padding-left:22px}li{margin-bottom:8px}
.btn{display:block;text-align:center;background:var(--p2);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:700;font-size:17px}
.muted{color:#5F5E5A;font-size:14px}
.warn{background:#FAEEDA;color:#633806;border-radius:12px;padding:12px 14px;font-size:14px}
.share{display:inline-block;border:1.5px solid #185FA5;color:#185FA5;border-radius:6px;padding:0 6px;font-weight:700}
.go{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:#5F5E5A}
.go img{width:96px;height:96px;border-radius:22px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><img data-icon src="apple-touch-icon.png" alt=""><div><h1>SPW ส่งงาน</h1><p>แม่บ้าน · คนสวน · ส่งรูปงานของวันนี้</p></div></header>
<main id="main"></main>
<script>
// หน้าส่งงานจริง (Google Apps Script) · รหัสส่วนตัวอยู่หลัง # จึงไม่ถูกส่งไปที่เว็บฝากนี้
var WORKER_URL='https://script.google.com/macros/s/AKfycbx4K0FnllMcPspbu_8X2vFxzTm-pDmTtqtMa0qHkhBEKXenR5KjQ1jqwnoIRxuY10B-5A/exec';
var main=document.getElementById('main');
function token(){var m=/[?&]w=([a-f0-9]{16}|[-a-f0-9]{64,80})(?![-a-f0-9])/i.exec(location.search||'')||/[#&]w=([a-f0-9]{16}|[-a-f0-9]{64,80})(?![-a-f0-9])/i.exec(location.hash||'');if(m){try{localStorage.setItem('spwCrewWorker',m[1]);}catch(e){}return m[1];}try{return localStorage.getItem('spwCrewWorker')||'';}catch(e){return '';}}
function target(t){return WORKER_URL+(t?'?w='+encodeURIComponent(t):'');}
var t=token(),standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
if(standalone&&t){
 main.innerHTML='<div class="go"><img data-icon src="apple-touch-icon.png" alt=""><div>กำลังเปิดหน้าส่งงาน…</div><a class="btn" href="'+target(t)+'">แตะที่นี่ถ้ายังไม่เปิด</a></div>';
 location.replace(target(t));
}else{
 // เปิดจากแชท LINE: ขอให้ LINE เปิดใน Chrome / Safari แทนหน้าต่างของ LINE (เพิ่มไอคอนลงหน้าจอได้)
 var ua=navigator.userAgent||'',inLine=/\bLine\//i.test(ua),inApp=inLine||/FBAN|FBAV|Instagram|; wv\)/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua),isAndroid=/Android/i.test(ua);
 if(inLine&&!/[?&]openExternalBrowser=1/.test(location.search)){location.replace(location.pathname+(location.search?location.search+'&':'?')+'openExternalBrowser=1'+location.hash);}
 var ios='<div class="card"><h2>📱 เพิ่มไอคอนไว้ที่หน้าจอโฮม (ทำครั้งเดียว)</h2><ol><li>กดปุ่ม <span class="share">แชร์ ⬆</span> ด้านล่างจอ (ต้องเปิดใน Safari)</li><li>เลื่อนลง แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b></li><li>ถ้ามีสวิตช์ <b>"เปิดเป็นแอปหน้าเว็บ"</b> ให้เปิดไว้ (สีเขียว)</li><li>กด <b>"เพิ่ม"</b> · จะได้ไอคอนสีม่วง "ส่งงาน"</li></ol></div>';
 var android='<div class="card"><h2>📱 ติดตั้งไอคอนไว้ที่หน้าจอ (ทำครั้งเดียว)</h2><button type="button" class="btn" data-install hidden style="width:100%;border:0;margin-bottom:10px">📲 ติดตั้งแอปส่งงาน</button><ol data-install-hint><li>กด <b>⋮</b> มุมขวาบนของ Chrome</li><li>เลือก <b>"เพิ่มลงในหน้าจอหลัก"</b> หรือ <b>"ติดตั้งแอป"</b></li><li>กด <b>"เพิ่ม" / "ติดตั้ง"</b> · จะได้ไอคอนสีม่วง "ส่งงาน"</li></ol><p id="instmsg" class="muted" hidden>✓ ติดตั้งแล้ว · ครั้งต่อไปกดไอคอน "ส่งงาน" ที่หน้าจอได้เลย</p></div>';
 var inapp='<div class="card warn"><b>เปิดอยู่ในหน้าต่างของ '+(inLine?'LINE':'แอปแชท')+'</b><br>กด <b>⋮</b> (หรือ <b>↗</b>) มุมขวาบน แล้วเลือก <b>"เปิดในเบราว์เซอร์"</b> / <b>"เปิดใน '+(isIOS?'Safari':'Chrome')+'"</b> ก่อน แล้วค่อยเพิ่มไอคอน</div>';
 // Android ที่ไม่ใช่ Chrome (เบราว์เซอร์ที่มากับเครื่อง เช่น Mi / OPPO / vivo / Samsung) มักไม่มีเมนูเพิ่มไอคอน → ปุ่มเปิดใน Chrome (intent)
 var otherBrowser=isAndroid&&!inApp&&(!/Chrome\/\d/.test(ua)||/SamsungBrowser|MiuiBrowser|XiaoMi|HeyTapBrowser|OppoBrowser|VivoBrowser|HuaweiBrowser|HONORBrowser|UCBrowser|OPR\/|Opera|EdgA|YaBrowser|Firefox|DuckDuckGo|PHX\/|Quark|Puffin|; wv\)/i.test(ua));
 var chromeUrl='intent://'+location.host+location.pathname+(location.search||'')+(location.hash||'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.android.chrome')+';end';
 var chromeCard='<div class="card warn"><b>เบราว์เซอร์นี้ติดตั้งไอคอนไม่ได้</b><br>กดปุ่มด้านล่างเพื่อเปิดหน้านี้ใน <b>Chrome</b> แล้วค่อยติดตั้งไอคอน</div><a class="btn" id="openchrome" href="'+chromeUrl+'" style="margin-bottom:14px">🌐 เปิดใน Chrome</a>';
 main.innerHTML=(t?'':'<div class="card warn">ลิงก์นี้ยังไม่มีรหัสของคุณ · กรุณาสแกน QR ที่หัวหน้าให้ด้วยกล้องมือถือ</div>')+
 (inApp?inapp:'')+(otherBrowser?chromeCard:'')+(isAndroid?android:isIOS?ios:ios+android)+
 (isAndroid&&!otherBrowser&&!inApp?'<p class="muted" style="text-align:center;margin:-4px 0 14px">ไม่เจอเมนู "เพิ่มลงในหน้าจอหลัก"? <a href="'+chromeUrl+'">เปิดหน้านี้ใน Chrome</a></p>':'')+
 (t?'<a class="btn" href="'+target(t)+'">เปิดหน้าส่งงานเลย</a>':'')+
 '<p class="muted" style="text-align:center;margin-top:14px">ลิงก์นี้เป็นของคุณคนเดียว ห้ามส่งต่อให้ผู้อื่น</p>';
 // ปุ่มติดตั้งแอป (Android Chrome) · ไม่ต้องหาเมนู ⋮
 var installEvt=null;
 if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
 var installBtns=function(){var bs=document.querySelectorAll('[data-install]');for(var i=0;i<bs.length;i++)bs[i].hidden=!installEvt;var hs=document.querySelectorAll('[data-install-hint]');for(var j=0;j<hs.length;j++)hs[j].hidden=!!installEvt;};
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;installBtns();});
 window.addEventListener('appinstalled',function(){installEvt=null;installBtns();var m=document.getElementById('instmsg');if(m)m.hidden=false;});
 document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('[data-install]');if(!b||!installEvt)return;ev.preventDefault();installEvt.prompt();installEvt.userChoice.then(function(){installEvt=null;installBtns();});});
}
applyIcon(ICON_NOW);</script>
</body>
</html>
