<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>งานช่าง</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>if(!/iPhone|iPad|iPod/i.test(navigator.userAgent)){var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}</script>
<script>/* มือถือที่ Chrome เปิด "เว็บไซต์แบบเดสก์ท็อป" ค้างไว้: ย่อขยายหน้าให้กว้างเท่าจอมือถือ ฟอร์มจะได้เป็นแบบมือถือ ตัวใหญ่ */
window.phoneFit=function(){try{var sw=screen.width,iw=window.innerWidth,touch=(navigator.maxTouchPoints||0)>0;var k=(touch&&sw>0&&sw<820&&iw>sw*1.25)?iw/sw:1,de=document.documentElement,app=document.getElementById('app'),bar=document.getElementById('bar');de.dataset.phoneFit=k===1?'':'1';
 if(app){de.style.zoom='';if(bar)bar.style.zoom=k===1?'':String(k);if(k===1){app.style.width=app.style.height=app.style.transform=app.style.transformOrigin=app.style.top='';return;}
  var top=bar?48*k:0;app.style.transformOrigin='0 0';app.style.transform='scale('+k+')';app.style.width=sw+'px';
  if(bar){app.style.top=top+'px';app.style.height=((window.innerHeight-top)/k)+'px';}else{app.style.top='';app.style.height='calc((100vh - env(safe-area-inset-top)) / '+k+')';}}
 else{de.style.zoom=k===1?'':String(k);}}catch(e){}};
/* ใช้ transform กับกรอบระบบ (ไม่ใช้ zoom) เพื่อให้ตำแหน่งที่แตะตรงกับช่องกรอกจริง */
window.phoneFit();(function(){var lw=window.innerWidth,ls=screen.width;window.addEventListener('resize',function(){if(window.innerWidth===lw&&screen.width===ls)return;var a=document.activeElement;if(a&&a.id==='app')return;lw=window.innerWidth;ls=screen.width;window.phoneFit();});})();</script><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="งานช่าง">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>/* ไอคอนและชื่อที่อัปโหลดในระบบติดตามงานช่าง (ตั้งค่าระบบ → ไอคอนแอป) */var ICON_KEY='tech',ICONS_URL='https://script.google.com/macros/s/AKfycbx4K0FnllMcPspbu_8X2vFxzTm-pDmTtqtMa0qHkhBEKXenR5KjQ1jqwnoIRxuY10B-5A/exec?icons=1';function applyIcon(o){if(!o||!o.url)return;var a=document.querySelector('link[rel=apple-touch-icon]');if(a)a.href=o.url;var f=document.querySelector('link[rel=icon]');if(f)f.href=o.url;var im=document.querySelectorAll('img[data-icon]');for(var i=0;i<im.length;i++)im[i].src=o.url;if(o.name){var m=document.querySelector('meta[name=apple-mobile-web-app-title]');if(m)m.content=o.name;document.title=o.name;}}var ICON_NOW=null;try{ICON_NOW=JSON.parse(localStorage.getItem('spwIcon_'+ICON_KEY)||'null');}catch(e){}applyIcon(ICON_NOW);if(window.fetch)fetch(ICONS_URL).then(function(r){return r.json();}).then(function(j){var o=j&&j[ICON_KEY];if(o&&o.url){ICON_NOW=o;try{localStorage.setItem('spwIcon_'+ICON_KEY,JSON.stringify(o));}catch(e){}applyIcon(o);}}).catch(function(){});</script>
<meta name="theme-color" content="#142b43">
<style>
:root{--blue:#185FA5;--navy:#142b43}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;font:17px/1.6 -apple-system,system-ui,Tahoma,sans-serif;color:var(--navy);background:#EEF2F7}
header{background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 22px;display:flex;gap:14px;align-items:center}
header img{width:64px;height:64px;border-radius:15px;border:2px solid rgba(255,255,255,.35)}
header h1{margin:0;font-size:22px}header p{margin:2px 0 0;color:#DCEBFA;font-size:14px}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border:1px solid #D3D1C7;border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}
ol{margin:0;padding-left:22px}li{margin-bottom:8px}
.btn{display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:700;font-size:17px}
.muted{color:#5F5E5A;font-size:14px}
.share{display:inline-block;border:1.5px solid #185FA5;color:#185FA5;border-radius:6px;padding:0 6px;font-weight:700}
body.full{background:#142b43;overflow:hidden}
#app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#EEF2F7}
body.tab #app{top:48px;height:calc(100% - 48px)}
#bar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#142b43;color:#fff;font-size:15px}
#bar img{width:30px;height:30px;border-radius:8px}#bar b{flex:1}
#bar button{border:0;border-radius:10px;background:#1D9E75;color:#fff;font:700 14px/1 inherit;font-family:inherit;padding:9px 12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header id="hd"><img data-icon src="apple-touch-icon.png" alt=""><div><h1>SPW งานช่าง</h1><p>ระบบติดตามงานช่าง · บริษัท อู่เงิน จำกัด</p></div></header>
<main id="main"></main>
<script>
// ระบบติดตามงานช่าง · ทำงานในนามเจ้าของ ฝังไว้เต็มจอ ไม่มีแถบของ Google · ลงชื่อด้วย Gmail ครั้งเดียวต่อเครื่อง
var APP_URL='https://script.google.com/macros/s/AKfycbytSRku2ZSb507T_AyjqBhpUtxgjIIC7M_bxguBW_-W8he0VXJEpqpfrZrFIbXnRH2_DA/exec',RET='tech',KEY='spwTechToken';
function q(n){var m=new RegExp('[?&]'+n+'=([^&#]+)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
var t=q('t'),open=q('open'),tok='';try{tok=localStorage.getItem(KEY)||'';}catch(e){}
/* ลิงก์ "เปิดดูงาน" จากแจ้งเตือน LINE: ?job=<รหัสงาน> · จำไว้ 30 นาที เผื่อต้องลงชื่อเข้าใช้ก่อน แล้วค่อยเปิดงานนั้นหลังกลับมา */
var JOBKEY='spwTechJob',job=q('job');if(!/^[A-Za-z0-9_-]{1,80}$/.test(job))job='';
if(job){try{localStorage.setItem(JOBKEY,JSON.stringify({id:job,at:Date.now()}));}catch(e){}}
else if(t){try{var pj=JSON.parse(localStorage.getItem(JOBKEY)||'null');if(pj&&/^[A-Za-z0-9_-]{1,80}$/.test(pj.id)&&Date.now()-Number(pj.at)<1800000)job=pj.id;localStorage.removeItem(JOBKEY);}catch(e){}}
else{try{localStorage.removeItem(JOBKEY);}catch(e){}}
var standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
window.addEventListener('message',function(ev){var h='';try{h=new URL(ev.origin).hostname;}catch(e){}if(!/(^|\.)googleusercontent\.com$|(^|\.)script\.google\.com$/.test(h))return;var d=ev.data;if(d&&typeof d.spwTechToken==='string'){try{if(d.spwTechToken)localStorage.setItem(KEY,d.spwTechToken);else localStorage.removeItem(KEY);}catch(e){}}});
var ID_URL='https://script.google.com/macros/s/AKfycbxurQbqrGyq36ZoE_xEPQ_vCzM67nfNAAeg-GdMZaYJpWWjYQKmr5rUWZOD_Ivz-11wQA/exec?';
function showLogin(url,msg){try{localStorage.removeItem(KEY);}catch(e){}var f=document.getElementById('app');if(f)f.remove();var bb=document.getElementById('bar');if(bb)bb.remove();document.body.className='';window.phoneFit&&setTimeout(window.phoneFit,0);
 var esc=function(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
 document.body.insertAdjacentHTML('afterbegin','<header><img data-icon src="'+((ICON_NOW&&ICON_NOW.url)||'apple-touch-icon.png')+'" alt=""><div><h1>SPW งานช่าง</h1><p>ลงชื่อเข้าใช้ครั้งแรกบนเครื่องนี้</p></div></header><main><div class="card" style="text-align:center">'+(msg?'<p style="background:#FCEBEB;color:#791F1F;border-radius:10px;padding:10px 12px;text-align:left">'+esc(msg)+'</p>':'')+'<h2>ลงชื่อเข้าใช้ระบบติดตามงานช่าง</h2><p class="muted">ใช้บัญชี Google ที่ผู้ดูแลระบบเพิ่มไว้ · ลงชื่อครั้งเดียวต่อเครื่อง</p><a class="btn" href="'+esc(url)+'">ลงชื่อเข้าใช้ด้วย Google</a></div></main>');}
window.addEventListener('message',function(ev){var h='';try{h=new URL(ev.origin).hostname;}catch(e){}if(!/(^|\.)googleusercontent\.com$|(^|\.)script\.google\.com$/.test(h))return;var d=ev.data;if(d&&typeof d.spwTechLogin==='string'&&d.spwTechLogin.indexOf(ID_URL)===0)showLogin(d.spwTechLogin,d.msg);});/* ปุ่มติดตั้งแอปในหน้า (Android Chrome) · ไม่ต้องหาเมนู ⋮ */
var installEvt=null,isAndroid=/Android/i.test(navigator.userAgent);
if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
function installBtns(){var bs=document.querySelectorAll('[data-install]');for(var i=0;i<bs.length;i++)bs[i].hidden=!installEvt;var hs=document.querySelectorAll('[data-install-hint]');for(var j=0;j<hs.length;j++)hs[j].hidden=!!installEvt||!isAndroid;}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;installBtns();});
window.addEventListener('appinstalled',function(){installEvt=null;installBtns();var m=document.getElementById('instmsg');if(m)m.hidden=false;});
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('[data-install]');if(!b||!installEvt)return;ev.preventDefault();installEvt.prompt();installEvt.userChoice.then(function(){installEvt=null;installBtns();});});
function openApp(){var src=APP_URL+'?ret='+RET+(t?'&t='+encodeURIComponent(t):(/^[-a-f0-9]{64,80}$/i.test(tok)?'&d='+encodeURIComponent(tok):''))+(job?'&jobId='+encodeURIComponent(job):'');
 document.body.className='full'+(standalone?'':' tab');document.getElementById('hd').remove();document.getElementById('main').remove();
 if(!standalone)document.body.insertAdjacentHTML('afterbegin','<div id="bar"><img data-icon src="'+((ICON_NOW&&ICON_NOW.url)||'apple-touch-icon.png')+'" alt=""><b>SPW งานช่าง</b><button type="button" data-install hidden>📲 ติดตั้งแอป</button></div>');
 var f=document.createElement('iframe');f.id='app';f.src=src;f.allow='camera; microphone; clipboard-read; clipboard-write; fullscreen';f.title='ระบบติดตามงานช่าง';document.body.appendChild(f);window.phoneFit&&window.phoneFit();
 if(t||job)try{history.replaceState(null,'',location.pathname+(standalone?'':'?open=1'));}catch(e){}installBtns();}
if(standalone||t||open||job){openApp();}
else{document.getElementById('main').innerHTML='<div id="instmsg" class="card" hidden style="background:#E1F5EE;border-color:#9FE1CB">✓ ติดตั้งแล้ว · ดูไอคอน "งานช่าง" ที่หน้าจอหลัก (หรือปัดขึ้นในหน้ารวมแอป)</div>'+
 '<a class="btn" href="#" data-install hidden style="background:#0F6E56;margin-bottom:14px">📲 ติดตั้งแอปงานช่าง</a>'+
 '<div class="card" data-install-hint hidden><h2>📲 Android</h2><p style="margin:0">กด <b>⋮</b> มุมขวาบนของ Chrome → <b>"ติดตั้งและสร้างทางลัด"</b> → <b>"ติดตั้ง"</b></p><p class="muted">ถ้าไม่เห็นแถบด้านบน ให้เลื่อนหน้าลงเล็กน้อย</p></div>'+
 '<div class="card"><h2>📱 iPhone</h2><ol><li>กดปุ่ม <span class="share">แชร์ ⬆</span> ด้านล่างจอ (ต้องเปิดใน Safari)</li><li>เลื่อนลง แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b></li><li>เปิดสวิตช์ <b>"เปิดเป็นแอปหน้าเว็บ"</b> ไว้ (สีเขียว) แล้วกด <b>"เพิ่ม"</b></li></ol><p class="muted">ครั้งแรกที่เปิดจะให้ลงชื่อด้วย Gmail ที่ผู้ดูแลเพิ่มไว้ หนึ่งครั้งต่อเครื่อง</p></div><a class="btn" href="?open=1">เปิดระบบในเบราว์เซอร์</a>';installBtns();}
applyIcon(ICON_NOW);
</script>
</body>
</html>
